<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Developer Console</title>
<style>
  :root {
    --bg: #1b1c21;
    --bg-2: #22232a;
    --ring: #2b2c33;
    --line: rgba(255,255,255,.08);
    --text: #e8e8ec;
    --muted: #8b8c96;
    --accent: #ff8a4c;
    --ok: #7ee2a8;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 70% 0%, #24252c 0%, var(--bg) 60%);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", "Noto Sans KR", sans-serif;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 20px 28px; border-bottom: 1px solid var(--line);
  }
  .logo { font-weight: 700; letter-spacing: -.02em; font-size: 18px; }
  .logo span { color: var(--accent); font-weight: 600; font-size: 12px; margin-left: 8px;
               border: 1px solid rgba(255,138,76,.4); border-radius: 999px; padding: 2px 8px; vertical-align: middle; }
  a.back { color: var(--muted); text-decoration: none; font-size: 14px; }
  a.back:hover { color: var(--text); }
  main { max-width: 1080px; margin: 0 auto; padding: 40px 24px 80px; }
  h1 { font-size: clamp(24px, 4vw, 34px); letter-spacing: -.03em; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 32px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .panel { background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 14px; min-width: 0; }
  .panel.wide { grid-column: 1 / -1; }
  .panel h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 15px; }
  .panel h2 svg { color: var(--muted); }
  .panel h2 .spacer { flex: 1; }

  .kv { display: flex; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; align-items: center; }
  .kv:first-of-type { border-top: 0; }
  .kv .k { color: var(--muted); flex: none; width: 110px; }
  .kv .v { flex: 1; min-width: 0; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }

  button, input {
    font: inherit; color: var(--text); background: var(--ring); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; font-size: 13px;
  }
  button { cursor: pointer; }
  button:hover { border-color: rgba(255,255,255,.22); }
  button.danger { color: #ff8b8b; }
  button.danger.confirm { border-color: rgba(255,107,107,.6); background: rgba(255,107,107,.12); }
  button.ghost { background: none; border-color: transparent; color: var(--muted); padding: 2px 8px; }
  button.ghost:hover { color: var(--bad); background: rgba(255,107,107,.12); }
  input { min-width: 0; flex: 1; }
  input:focus, button:focus-visible { outline: 2px solid rgba(255,138,76,.5); outline-offset: 1px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; border-top: 0; }
  td { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; overflow-wrap: anywhere; }
  td.act { width: 44px; text-align: right; }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  .switch { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .switch:first-of-type { border-top: 0; }
  .sw { width: 34px; height: 20px; border-radius: 10px; background: #4a4b55; position: relative; border: 0; padding: 0; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #c9cad1; transition: transform .15s; }
  .sw[aria-checked="true"] { background: var(--accent); }
  .sw[aria-checked="true"]::after { transform: translateX(14px); background: #fff; }

  .seg-ctl { display: inline-flex; background: var(--ring); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg-ctl button { border: 0; border-radius: 999px; background: none; color: var(--muted); padding: 5px 14px; }
  .seg-ctl button[aria-pressed="true"] { background: var(--text); color: var(--bg); }

  .locked { max-width: 420px; margin: 18vh auto 0; text-align: center; padding: 0 24px; }
  .locked h1 { font-size: 24px; }
  .locked p { color: var(--muted); }
  .locked a { color: var(--accent); }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 10px;
    font-size: 14px; opacity: 0; transition: .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  body.debug-outline main * { outline: 1px solid rgba(255,138,76,.45) !important; }

  @media (max-width: 480px) {
    header { padding: 16px; }
    main { padding: 28px 16px 60px; }
    .grid { grid-template-columns: 1fr; }
    .kv .k { width: 90px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Utility System<span>DEV</span></div>
  <a class="back" href="index.html">← 메인으로</a>
</header>

<!-- 권한 없을 때 -->
<div class="locked" id="locked" hidden>
  <h1>접근 권한이 없습니다</h1>
  <p>개발자 권한이 있는 계정만 볼 수 있는 페이지입니다.</p>
  <p><a href="index.html">메인으로 돌아가기</a></p>
</div>

<main id="app" hidden>
  <h1>개발자 페이지</h1>
  <p class="lead">현재 브라우저 환경을 확인하고, 저장된 데이터와 화면 디버깅 도구를 다룹니다.</p>

  <div class="grid">
    <!-- 환경 정보 -->
    <section class="panel">
      <h2><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>
        환경 정보<span class="spacer"></span><button id="copyEnv">복사</button></h2>
      <div id="env"></div>
    </section>

    <!-- 네트워크 -->
    <section class="panel">
      <h2><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>
        네트워크</h2>
      <div id="net"></div>
    </section>

    <!-- 화면 도구 / 권한 -->
    <section class="panel">
      <h2><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 3v18"/></svg>
        화면 · 권한</h2>
      <div class="switch">요소 외곽선 표시 <button class="sw" id="outlineSw" role="switch" aria-checked="false" aria-label="요소 외곽선 표시"></button></div>
      <div class="switch">계정 권한
        <span class="seg-ctl">
          <button data-role="user">일반</button>
          <button data-role="developer">개발자</button>
        </span>
      </div>
    </section>

    <!-- 스토리지 -->
    <section class="panel wide">
      <h2><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
        스토리지<span class="spacer"></span>
        <span class="seg-ctl" id="storeTabs">
          <button data-store="local" aria-pressed="true">localStorage</button>
          <button data-store="session" aria-pressed="false">sessionStorage</button>
        </span>
      </h2>
      <div id="storeTable"></div>
      <form class="row" id="addForm">
        <input id="newKey" placeholder="키" aria-label="키" required>
        <input id="newVal" placeholder="값" aria-label="값">
        <button type="submit">추가 / 수정</button>
        <button type="button" class="danger" id="clearStore">전체 비우기</button>
      </form>
    </section>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
(() => {
  /* ---------- 권한 (index.html 과 같은 임시 방식) ---------- */
  const ROLE_KEY = 'us.devRole';
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const getRole = () => new URLSearchParams(location.search).get('role') || store.get(ROLE_KEY) || 'user';

  if (getRole() !== 'developer') {
    document.getElementById('locked').hidden = false;
    return;
  }
  document.getElementById('app').hidden = false;

  /* ---------- 공통 ---------- */
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const kv = (rows) => rows.map(([k, v]) => `<div class="kv"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`).join('');
  let toastTimer;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
  }

  /* ---------- 환경 정보 ---------- */
  function envInfo() {
    return {
      URL: location.href, 브라우저: navigator.userAgent, 화면: `${innerWidth} × ${innerHeight}`,
      배율: devicePixelRatio + 'x', 언어: navigator.language, 권한: getRole(),
      시간대: Intl.DateTimeFormat().resolvedOptions().timeZone,
    };
  }
  function renderEnv() { $('env').innerHTML = kv(Object.entries(envInfo()).map(([k, v]) => [k, esc(v)])); }
  $('copyEnv').addEventListener('click', () => {
    const text = Object.entries(envInfo()).map(([k, v]) => `${k}: ${v}`).join('\n');
    navigator.clipboard?.writeText(text).then(() => toast('환경 정보 복사됨'), () => toast('복사 실패'));
  });
  addEventListener('resize', renderEnv);

  /* ---------- 네트워크 ---------- */
  function renderNet() {
    const c = navigator.connection || {}, on = navigator.onLine;
    $('net').innerHTML = kv([
      ['상태', `<span class="dot" style="background:var(${on ? '--ok' : '--bad'})"></span>${on ? '온라인' : '오프라인'}`],
      ['유형', esc(c.effectiveType || '-')],
      ['대역폭', esc(c.downlink ? c.downlink + ' Mbps' : '-')],
      ['지연', esc(c.rtt != null ? c.rtt + ' ms' : '-')],
    ]);
  }
  addEventListener('online', renderNet); addEventListener('offline', renderNet);
  navigator.connection?.addEventListener?.('change', renderNet);

  /* ---------- 화면 · 권한 ---------- */
  $('outlineSw').addEventListener('click', (e) => {
    const on = document.body.classList.toggle('debug-outline');
    e.currentTarget.setAttribute('aria-checked', on);
  });
  document.querySelectorAll('[data-role]').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.role === getRole()));
    b.addEventListener('click', () => {
      store.set(ROLE_KEY, b.dataset.role);
      if (b.dataset.role !== 'developer') location.href = 'index.html';
    });
  });

  /* ---------- 스토리지 ---------- */
  let which = 'local';
  const S = () => { try { return which === 'local' ? localStorage : sessionStorage; } catch { return null; } };
  function renderStore() {
    const s = S(); const keys = [];
    try { for (let i = 0; i < s.length; i++) keys.push(s.key(i)); } catch {}
    keys.sort();
    $('storeTable').innerHTML = keys.length
      ? `<table><thead><tr><th style="width:35%">키</th><th>값</th><th class="act"></th></tr></thead><tbody>${
          keys.map(k => `<tr><td>${esc(k)}</td><td>${esc(s.getItem(k))}</td><td class="act"><button class="ghost" data-del="${esc(k)}" aria-label="${esc(k)} 삭제">✕</button></td></tr>`).join('')
        }</tbody></table>`
      : '<div class="empty">저장된 값이 없습니다</div>';
    $('storeTable').querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
      try { S().removeItem(b.dataset.del); } catch {}
      renderStore(); renderEnv();
    }));
  }
  $('storeTabs').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    which = b.dataset.store;
    $('storeTabs').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    renderStore();
  }));
  $('addForm').addEventListener('submit', (e) => {
    e.preventDefault();
    try { S().setItem($('newKey').value, $('newVal').value); } catch { toast('저장 실패'); return; }
    $('newKey').value = ''; $('newVal').value = ''; $('newKey').focus();
    renderStore();
  });
  let confirmTimer;
  $('clearStore').addEventListener('click', (e) => {
    const btn = e.currentTarget;
    if (!btn.classList.contains('confirm')) {
      btn.classList.add('confirm'); btn.textContent = '한 번 더 누르면 비워집니다';
      confirmTimer = setTimeout(() => { btn.classList.remove('confirm'); btn.textContent = '전체 비우기'; }, 2500);
      return;
    }
    clearTimeout(confirmTimer);
    btn.classList.remove('confirm'); btn.textContent = '전체 비우기';
    const role = store.get(ROLE_KEY);
    try { S().clear(); } catch {}
    if (which === 'local' && role) store.set(ROLE_KEY, role);   // 임시 권한 값은 유지
    renderStore(); toast('비웠습니다');
  });

  renderEnv(); renderNet(); renderStore();
})();
</script>
</body>
</html>
