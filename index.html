<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utility System</title>
<style>
  :root {
    --bg: #1b1c21;
    --bg-2: #22232a;
    --ring: #2b2c33;
    --ring-hi: #3a3b44;
    --line: rgba(255,255,255,.08);
    --text: #e8e8ec;
    --muted: #8b8c96;
    --accent: #ff8a4c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 70% 20%, #24252c 0%, var(--bg) 60%);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", "Noto Sans KR", sans-serif;
    overflow-x: hidden;
  }

  /* ---------- 임시 메인 페이지 ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 28px; border-bottom: 1px solid var(--line);
  }
  .logo { font-weight: 700; letter-spacing: -.02em; font-size: 18px; }
  .logo span { color: var(--muted); font-weight: 500; }
  main { max-width: 960px; margin: 0 auto; padding: 72px 24px; }
  h1 { font-size: clamp(28px, 5vw, 44px); letter-spacing: -.03em; margin: 0 0 12px; }
  .lead { color: var(--muted); margin: 0 0 40px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .card {
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; min-height: 120px;
  }
  .card h3 { margin: 0 0 6px; font-size: 15px; }
  .card p { margin: 0; color: var(--muted); font-size: 13px; }

  /* 역할 전환 (임시 – 실제 인증 붙기 전까지) */
  .role {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 6px 6px 12px; font-size: 13px; color: var(--muted);
  }
  .role button {
    border: 0; border-radius: 999px; padding: 4px 12px; cursor: pointer;
    background: var(--ring); color: var(--muted); font: inherit;
  }
  .role button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .hint { margin-top: 28px; color: var(--muted); font-size: 13px; }
  kbd { background: var(--ring); border-radius: 5px; padding: 1px 6px; font-size: 12px; }

  /* ---------- 개발자 다이얼 메뉴 ---------- */
  .dial-layer {
    position: fixed; inset: 0; z-index: 9999; display: none;
    background: rgba(10,10,14,.35); backdrop-filter: blur(2px);
  }
  .dial-layer.open { display: block; animation: fade .15s ease-out; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }

  .dial {
    position: absolute; width: 300px; height: 300px;
    transform: translate(-50%, -50%) scale(.92); opacity: 0;
    transition: transform .2s cubic-bezier(.2,.9,.3,1.2), opacity .15s;
  }
  .dial-layer.open .dial { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  .dial > svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 20px 40px rgba(0,0,0,.5)); }
  .seg { fill: var(--ring); stroke: #1f2026; stroke-width: 2; cursor: pointer; transition: fill .12s; }
  .seg-group.active .seg { fill: url(#hatch); }
  .seg-icon { pointer-events: none; color: var(--muted); transition: color .12s; }
  .seg-group.active .seg-icon { color: #fff; }

  .knob {
    position: absolute; left: 50%; top: 50%; width: 112px; height: 112px;
    transform: translate(-50%, -50%); border-radius: 50%; cursor: pointer;
    background: radial-gradient(circle at 40% 35%, #ffffff 0%, #eceef1 45%, #c9ccd2 100%);
    box-shadow:
      0 0 0 6px #17181d,
      0 0 24px 4px rgba(255,138,76,.25),
      inset 0 -6px 12px rgba(0,0,0,.15);
    display: grid; place-items: center; color: #2a2b31; border: 0;
  }
  .knob > svg { width: 20px; height: 20px; margin-top: -10px; }
  .knob::before {
    content: ""; position: absolute; inset: 10px; border-radius: 50%;
    border: 2px dotted rgba(0,0,0,.18);
  }
  .knob-label {
    position: absolute; top: calc(50% + 28px); left: 0; right: 0; text-align: center;
    font-size: 10px; font-weight: 600; letter-spacing: .04em; color: #6a6c74;
  }

  /* 하위 항목 패널 */
  .sub {
    position: absolute; display: flex; flex-direction: column; gap: 10px;
  }
  .sub-title { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-left: 4px; }
  .sub-item {
    display: flex; align-items: center; gap: 12px; min-width: 230px;
    padding: 12px 16px; border-radius: 10px; cursor: pointer;
    background: rgba(43,44,51,.92); border: 1px solid var(--line);
    color: var(--muted); font: inherit; text-align: left;
    box-shadow: 0 10px 24px rgba(0,0,0,.35);
    opacity: 0; transform: translateX(-8px);
    animation: slide .18s ease-out forwards;
  }
  .sub-item:hover, .sub-item:focus-visible { color: var(--text); border-color: rgba(255,255,255,.22); outline: 0; }
  .sub-item svg { flex: none; }
  @keyframes slide { to { opacity: 1; transform: none; } }
  .sub.left .sub-item { transform: translateX(8px); }
  .connector { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  .connector path { stroke: rgba(255,255,255,.25); fill: none; stroke-width: 1.2; }

  /* 토스트 */
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 10px;
    font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; z-index: 10000;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  body.debug-outline * { outline: 1px solid rgba(255,138,76,.45) !important; }
</style>
</head>
<body>

<header>
  <div class="logo">Utility System <span>· temp</span></div>
  <div class="role" title="임시 역할 전환 — 실제 인증 연동 전까지 사용">
    계정 권한
    <button data-role="user">일반</button>
    <button data-role="developer">개발자</button>
  </div>
</header>

<main>
  <h1>메인 페이지 (임시)</h1>
  <p class="lead">메인 페이지 구성이 정해지기 전까지 사용하는 임시 화면입니다.</p>
  <div class="grid">
    <div class="card"><h3>섹션 A</h3><p>Placeholder</p></div>
    <div class="card"><h3>섹션 B</h3><p>Placeholder</p></div>
    <div class="card"><h3>섹션 C</h3><p>Placeholder</p></div>
    <div class="card"><h3>섹션 D</h3><p>Placeholder</p></div>
  </div>
  <p class="hint">
    개발자 권한 계정은 아무 곳에서나 <kbd>우클릭</kbd> 하면 개발자 다이얼이 열립니다.
    휠/방향키로 회전, <kbd>Enter</kbd> 선택, <kbd>Esc</kbd> 닫기.
    브라우저 기본 메뉴가 필요하면 <kbd>Shift</kbd>+우클릭.
  </p>
</main>

<div class="dial-layer" id="dialLayer" aria-hidden="true">
  <div class="dial" id="dial" role="menu" aria-label="개발자 메뉴">
    <svg viewBox="0 0 300 300" id="dialSvg">
      <defs>
        <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="6" height="6" fill="#4a4b55"/>
          <line x1="0" y1="0" x2="0" y2="6" stroke="#5c5d68" stroke-width="2"/>
        </pattern>
      </defs>
      <g id="segments"></g>
    </svg>
    <button class="knob" id="knob" aria-label="닫기">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 8h10M7 12h10M7 16h10"/></svg>
      <span class="knob-label" id="knobLabel">DEV</span>
    </button>
  </div>
  <svg class="connector" id="connector"><path id="connectorPath"/></svg>
  <div class="sub" id="sub"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  /* =========================================================
   * 권한 (임시)
   * 실제 로그인/권한 시스템이 생기면 getCurrentUser()만 교체하면 됨.
   * ※ 클라이언트 체크는 UI 노출 여부만 결정. 실제 권한 검증은 서버에서 해야 함.
   * ========================================================= */
  const ROLE_KEY = 'us.devRole';
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  function getCurrentUser() {
    const q = new URLSearchParams(location.search).get('role');
    return { role: q || store.get(ROLE_KEY) || 'user' };
  }
  const hasDevPermission = () => getCurrentUser().role === 'developer';

  const roleBtns = document.querySelectorAll('.role button');
  function syncRoleUI() {
    const r = getCurrentUser().role;
    roleBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.role === r)));
  }
  roleBtns.forEach(b => b.addEventListener('click', () => {
    store.set(ROLE_KEY, b.dataset.role);
    syncRoleUI();
    toast(b.dataset.role === 'developer' ? '개발자 권한으로 전환' : '일반 권한으로 전환');
  }));
  syncRoleUI();

  /* =========================================================
   * 아이콘
   * ========================================================= */
  const I = (d) => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const ICON = {
    console:  I('<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3M13 15h4"/>'),
    inspect:  I('<path d="M4 4h7M4 4v7M20 20h-7M20 20v-7"/><path d="M9 9l6 6M15 10v5h-5"/>'),
    network:  I('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>'),
    storage:  I('<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>'),
    user:     I('<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>'),
    settings: I('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
    layout:   I('<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 3v18"/>'),
    logs:     I('<path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 1.5-2M4 12l1 1 1.5-2M4 18h2"/>'),
    doc:      I('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>'),
    refresh:  I('<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>'),
    trash:    I('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'),
    copy:     I('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>'),
  };

  /* =========================================================
   * 메뉴 정의 — 여기에 항목 추가/수정
   * ========================================================= */
  const MENU = [
    { label: '콘솔', icon: 'console', items: [
      { label: 'console.clear()', icon: 'trash', run: () => { console.clear(); toast('콘솔 정리됨'); } },
      { label: '환경 정보 출력', icon: 'doc', run: () => { console.table(envInfo()); toast('콘솔에 출력됨'); } },
    ]},
    { label: '레이아웃', icon: 'layout', items: [
      { label: '요소 외곽선 토글', icon: 'inspect', run: () => { document.body.classList.toggle('debug-outline'); toast('외곽선 ' + (document.body.classList.contains('debug-outline') ? 'ON' : 'OFF')); } },
      { label: '뷰포트 크기 보기', icon: 'layout', run: () => toast(`${innerWidth} × ${innerHeight} @${devicePixelRatio}x`) },
    ]},
    { label: '네트워크', icon: 'network', items: [
      { label: '연결 상태', icon: 'network', run: () => toast(navigator.onLine ? '온라인' : '오프라인') },
      { label: '현재 URL 복사', icon: 'copy', run: () => copy(location.href) },
    ]},
    { label: '스토리지', icon: 'storage', items: [
      { label: 'localStorage 보기', icon: 'doc', run: () => { const o = {}; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); o[k] = localStorage.getItem(k); } } catch {} console.table(o); toast(`${Object.keys(o).length}개 키 → 콘솔`); } },
      { label: 'localStorage 비우기', icon: 'trash', run: () => { try { localStorage.clear(); } catch {} syncRoleUI(); toast('localStorage 비움'); } },
      { label: 'sessionStorage 비우기', icon: 'trash', run: () => { try { sessionStorage.clear(); } catch {} toast('sessionStorage 비움'); } },
    ]},
    { label: '계정', icon: 'user', items: [
      { label: '일반 권한으로 보기', icon: 'user', run: () => { store.set(ROLE_KEY, 'user'); syncRoleUI(); toast('일반 권한으로 전환'); } },
    ]},
    { label: '설정', icon: 'settings', items: [
      { label: '강력 새로고침', icon: 'refresh', run: () => location.reload() },
    ]},
  ];

  /* =========================================================
   * 다이얼 렌더링
   * ========================================================= */
  const layer = document.getElementById('dialLayer');
  const dial = document.getElementById('dial');
  const segG = document.getElementById('segments');
  const sub = document.getElementById('sub');
  const knobLabel = document.getElementById('knobLabel');
  const connector = document.getElementById('connector');
  const connectorPath = document.getElementById('connectorPath');

  const C = 150, R0 = 76, R1 = 140, GAP = 2.2;  // 도 단위 간격
  // 6개 기준: 30°씩 돌려서 정중앙(위/아래)에 걸치는 칸 없이 오른쪽 3 · 왼쪽 3으로 나눔
  const N = MENU.length, STEP = 360 / N, OFFSET = STEP / 2;
  const angleOf = (i) => i * STEP + OFFSET;
  const pt = (r, deg) => { const a = (deg - 90) * Math.PI / 180; return [C + r * Math.cos(a), C + r * Math.sin(a)]; };
  function arcPath(a0, a1) {
    const large = a1 - a0 > 180 ? 1 : 0;
    const [x0, y0] = pt(R1, a0), [x1, y1] = pt(R1, a1), [x2, y2] = pt(R0, a1), [x3, y3] = pt(R0, a0);
    return `M${x0} ${y0}A${R1} ${R1} 0 ${large} 1 ${x1} ${y1}L${x2} ${y2}A${R0} ${R0} 0 ${large} 0 ${x3} ${y3}Z`;
  }

  MENU.forEach((m, i) => {
    const a0 = angleOf(i) - STEP / 2 + GAP / 2, a1 = a0 + STEP - GAP;
    const [ix, iy] = pt((R0 + R1) / 2, angleOf(i));
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.classList.add('seg-group');
    g.innerHTML = `<path class="seg" d="${arcPath(a0, a1)}" aria-label="${m.label}"></path>
      <g class="seg-icon" transform="translate(${ix - 10} ${iy - 10})">${ICON[m.icon]}</g>`;
    g.addEventListener('mouseenter', () => setActive(i));
    g.addEventListener('click', () => { setActive(i); focusFirstSub(); });
    segG.appendChild(g);
  });

  let active = -1, origin = { x: 0, y: 0 };

  function setActive(i) {
    i = ((i % N) + N) % N;
    if (i === active) return;
    active = i;
    [...segG.children].forEach((g, j) => g.classList.toggle('active', j === i));
    renderSub();
  }

  function renderSub() {
    const m = MENU[active];
    const W = 270, GAP_OUT = 40;

    // 활성 세그먼트가 있는 쪽(좌/우)에 패널을 띄움 → 연결선이 다이얼을 가로지르지 않게
    const ang = angleOf(active);
    const [sx] = pt(R1, ang);
    let right = sx - C >= -1;
    if (right && origin.x + C + GAP_OUT + W > innerWidth) right = false;
    else if (!right && origin.x - C - GAP_OUT - W < 0) right = true;

    sub.classList.toggle('left', !right);
    sub.innerHTML = `<div class="sub-title">${m.label}</div>` + m.items.map((it, k) =>
      `<button class="sub-item" role="menuitem" data-k="${k}" style="animation-delay:${k * 35}ms">${ICON[it.icon]}<span>${it.label}</span></button>`
    ).join('');
    sub.querySelectorAll('.sub-item').forEach(b => b.addEventListener('click', () => {
      const it = m.items[+b.dataset.k];
      close();
      it.run();
    }));

    // 세그먼트 바깥 끝 → 살짝 바깥으로 → 패널 첫 항목 높이로 수평 연결
    const toPage = ([x, y]) => [origin.x + x - C, origin.y + y - C];
    const [ax, ay] = toPage(pt(R1 + 2, ang));
    const [bx, by] = toPage(pt(R1 + 16, ang));
    const edge = right ? origin.x + C + GAP_OUT : origin.x - C - GAP_OUT;
    sub.style.left = right ? edge + 'px' : '';
    sub.style.right = right ? '' : (innerWidth - edge) + 'px';

    const first = sub.querySelector('.sub-item');
    const anchor = first.offsetTop + first.offsetHeight / 2;
    const top = Math.min(Math.max(by - anchor, 12), innerHeight - sub.offsetHeight - 12);
    sub.style.top = top + 'px';
    const py = top + anchor;

    let d;
    const sideOk = right ? bx >= origin.x - 1 : bx <= origin.x + 1;
    if (sideOk) {
      const mx = (bx + edge) / 2;
      d = `M${ax} ${ay}L${bx} ${by}H${mx}V${py}H${edge}`;
    } else {
      // 화면 끝이라 반대편에 패널이 뜬 경우 → 링 바깥을 따라 돌아서 연결
      const RR = R1 + 16, target = right ? 90 : 270;
      const delta = ((target - ang) % 360 + 360) % 360;
      const sweep = delta <= 180 ? 1 : 0;
      const [tx, ty] = toPage(pt(RR, target));
      d = `M${ax} ${ay}L${bx} ${by}A${RR} ${RR} 0 0 ${sweep} ${tx} ${ty}V${py}H${edge}`;
    }
    connector.setAttribute('width', innerWidth); connector.setAttribute('height', innerHeight);
    connectorPath.setAttribute('d', d);
  }

  function focusFirstSub() { sub.querySelector('.sub-item')?.focus(); }

  function open(x, y) {
    const pad = 160;
    origin.x = Math.min(Math.max(x, pad), innerWidth - pad);
    origin.y = Math.min(Math.max(y, pad), innerHeight - pad);
    dial.style.left = origin.x + 'px';
    dial.style.top = origin.y + 'px';
    active = -1;
    layer.classList.add('open');
    layer.setAttribute('aria-hidden', 'false');
    setActive(0);
  }
  function close() {
    layer.classList.remove('open');
    layer.setAttribute('aria-hidden', 'true');
  }
  const isOpen = () => layer.classList.contains('open');

  /* ---------- 이벤트 ---------- */
  document.addEventListener('contextmenu', (e) => {
    if (!hasDevPermission() || e.shiftKey) return;   // 일반 계정 / Shift+우클릭 → 기본 메뉴
    e.preventDefault();
    open(e.clientX, e.clientY);
  });
  layer.addEventListener('mousedown', (e) => { if (e.target === layer) close(); });
  layer.addEventListener('contextmenu', (e) => { e.preventDefault(); if (e.target === layer) open(e.clientX, e.clientY); });
  document.getElementById('knob').addEventListener('click', close);

  layer.addEventListener('wheel', (e) => {
    e.preventDefault();
    setActive(active + (e.deltaY > 0 ? 1 : -1));
  }, { passive: false });

  document.addEventListener('keydown', (e) => {
    if (!isOpen()) return;
    const inSub = document.activeElement?.classList.contains('sub-item');
    if (e.key === 'Escape') { inSub ? document.activeElement.blur() : close(); e.preventDefault(); }
    else if (!inSub && (e.key === 'ArrowRight' || e.key === 'ArrowDown')) { setActive(active + 1); e.preventDefault(); }
    else if (!inSub && (e.key === 'ArrowLeft' || e.key === 'ArrowUp')) { setActive(active - 1); e.preventDefault(); }
    else if (inSub && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      const items = [...sub.querySelectorAll('.sub-item')];
      const k = items.indexOf(document.activeElement) + (e.key === 'ArrowDown' ? 1 : -1);
      items[(k + items.length) % items.length].focus(); e.preventDefault();
    }
    else if (!inSub && e.key === 'Enter') { focusFirstSub(); e.preventDefault(); }
  });
  addEventListener('resize', () => isOpen() && close());

  /* ---------- 유틸 ---------- */
  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
  }
  function copy(text) {
    navigator.clipboard?.writeText(text).then(() => toast('복사됨'), () => toast('복사 실패'));
  }
  function envInfo() {
    return { url: location.href, userAgent: navigator.userAgent, viewport: `${innerWidth}x${innerHeight}`,
             dpr: devicePixelRatio, language: navigator.language, role: getCurrentUser().role };
  }
})();
</script>
